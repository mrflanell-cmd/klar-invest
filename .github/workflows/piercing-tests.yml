name: Piercing scanner tests
on:
  push:
    branches: [feature/piercing-app-integration]
  pull_request:
    branches: [feature/community-accounts-avatars]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -v -p 'test_piercing*.py'
      - run: python -m py_compile app.py
